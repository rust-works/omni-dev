# Effort capabilities checked 2026-09-23; criteria are uncalibrated routing hypotheses.
# The `gemini` model ladder for `omni-dev ai jev route` (#1820):
# flash (gemini-3-flash-preview) / pro (gemini-3.1-pro-preview) /
# deep-think (Gemini 3 Deep Think).
#
# Tiers are listed from least to most capable; `route` ranks them by position.
# The descriptions match the anthropic ladder rung for rung. The first two
# were re-evaluated in #1885 on Anthropic labels; this provider has no
# independent model-class labels or measured downstream success. Its third
# rung retains the retired Anthropic fable description (#1903).
tiers:
  - name: flash
    models:
      - name: gemini-3-flash-preview
        verified: "2026-09-23"
        sources: [https://ai.google.dev/gemini-api/docs/thinking]
        effort:
          kind: configurable
          control: generation_config.thinking_level
          supported_levels: [minimal, low, medium, high]
          levels:
            - name: minimal
              description: >-
                Minimal thinking suffices for a small mechanical change or checking a fully specified, local result.
            - name: low
              description: >-
                The stage is short, local and familiar, with explicit requirements and an obvious solution or review checklist.
            - name: medium
              description: >-
                The stage needs several reasoning steps and checking ordinary interactions, with a clear approach and bounded scope.
            - name: high
              description: >-
                The stage needs sustained reasoning about subtle behavior, multiple components, non-obvious failure modes or competing approaches.
    description: >-
      Reliable at implementing and reviewing well-scoped work across several files, including
      debugging and non-obvious interactions when the approach is clear. May need help with complex,
      open-ended design requiring sustained judgement.
  - name: pro
    models:
      - name: gemini-3.1-pro-preview
        verified: "2026-09-23"
        sources: [https://ai.google.dev/gemini-api/docs/thinking]
        effort:
          kind: configurable
          control: generation_config.thinking_level
          supported_levels: [low, medium, high]
          levels:
            - name: low
              description: >-
                The stage is short, local and familiar, with explicit requirements and an obvious solution or review checklist.
            - name: medium
              description: >-
                The stage needs several reasoning steps and checking ordinary interactions, with a clear approach and bounded scope.
            - name: high
              description: >-
                The stage needs sustained reasoning about subtle behavior, multiple components, non-obvious failure modes or competing approaches.
    description: >-
      Reliable at complex, open-ended design and research: weighing architectures and unfamiliar
      approaches, anticipating failure modes, and making security-critical judgements. Carries subtle
      multi-file implementation and review through with sustained judgement.
  - name: deep-think
    models:
      - name: Gemini 3 Deep Think
        verified: "2026-09-23"
        sources: [https://ai.google.dev/gemini-api/docs/thinking]
        effort:
          kind: unavailable
          reason: No configurable effort vocabulary for the Deep Think product was verified in the Gemini API thinking documentation.
    description: >-
      Strongest at open-ended design and research: choosing between architectures, working in
      unfamiliar territory with no precedent in the codebase, anticipating failure modes, and
      security-critical judgement.
