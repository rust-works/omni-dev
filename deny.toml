# deny.toml -- cargo-deny configuration for omni-dev
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# ── Advisories ────────────────────────────────────────────────────────
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # chrono is unmaintained, and no version is patched. It is a direct
    # dependency used across the crate; migrating off it is tracked in
    # https://github.com/rust-works/omni-dev/issues/2257. Remove this entry
    # when that lands.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration tracked in #2257" },
]

# ── Licenses ──────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# ── Bans ──────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "warn"

# ── Sources ───────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
