name: Commit Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history so the default base-branch range resolves
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Deterministic, no-AI validation (#1472), replacing action-works/omni-dev-commit-check:
      # across 40 runs the AI check caught zero commit-message defects and produced one false
      # positive (an Anthropic billing outage), while re-judging messages an AI had already
      # written against the same guidelines. `git commit message lint` is built into the
      # omni-dev binary itself, so this job builds it from this checkout and runs it against
      # its own history — no API key, no network call, no external action.
      - name: Build omni-dev
        run: cargo build --bin omni-dev
      - name: Lint commit messages
        run: ./target/debug/omni-dev git commit message lint --strict
