name: Changelog Check

# Each pull request adds its own changelog.d/<issue>.<type>.md fragment
# (changelog.d/vscode/ for the VS Code extension) instead of editing
# CHANGELOG.md, so no two pull requests conflict on the changelog, and none can
# have its bullet applied inside a section a release has since closed (#2129,
# #2213). The release assembles the fragments (`scripts/changelog.py collect`).
#
# This workflow validates every fragment, and on a pull request requires it to
# add or edit one (an extension one for a user-visible `editors/vscode/` change)
# and to leave the changelogs themselves alone. See changelog.d/README.md.
#
# It also runs on `merge_group`, so the required `Changelog` context reports on
# queue entries. The fragment *requirement* is a property of the pull request,
# which a queue rebase cannot change, so only fragment validity is checked there.
#
# There is deliberately no `paths:` filter. The job is cheap, and a context that
# always reports can be made required without a pull request that touches no
# changelog waiting on a check that never runs (docs/ci-path-split.md).
#
# Waivers are commit trailers (`Changelog: none <reason>`, `Changelog:
# amend-released <reason>`); see `python3 scripts/changelog.py --help`.

on:
  pull_request:
    branches: [ main ]
  # Merge queue entries; each has its own ref, so the concurrency group below
  # never cancels one entry for another.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # `check-pr` diffs from the merge base, so a shallow clone fails.
        fetch-depth: 0
    - name: Test the scripts
      run: python3 -m unittest discover -s scripts -p 'test_*.py'
    - name: Validate the fragments
      run: python3 scripts/changelog.py check
    # Pull request metadata goes through env, never interpolated into the script.
    - name: Require a fragment or a waiver
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: python3 scripts/changelog.py check-pr --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
